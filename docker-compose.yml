name: godis

x-godis: &godis
  build: .
  image: godis:dev
  restart: unless-stopped

x-cluster: &cluster --cluster=node-1=godis-1:7000/localhost:8081,node-2=godis-2:7000/localhost:8082,node-3=godis-3:7000/localhost:8083

services:
  godis-1:
    <<: *godis
    command: [--id=node-1, *cluster]
    ports: ["8081:8080", "2112:2112"]
    volumes: [godis-1-data:/data]

  godis-2:
    <<: *godis
    command: [--id=node-2, *cluster]
    ports: ["8082:8080", "2113:2112"]
    volumes: [godis-2-data:/data]

  godis-3:
    <<: *godis
    command: [--id=node-3, *cluster]
    ports: ["8083:8080", "2114:2112"]
    volumes: [godis-3-data:/data]

  prometheus:
    image: prom/prometheus:v3.15.0
    ports: ["9090:9090"]
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]

volumes:
  godis-1-data:
  godis-2-data:
  godis-3-data:
